# Tiny scenario for smoke_test.sh: 8 radars x 6 days x 2 h. Seconds to minutes to generate.
master_seed: 7
start_date: "2026-07-01"
n_days: 6
duration_h: 2.0
aoi:
  lat_min_deg: 32.0
  lat_max_deg: 33.5
  lon_min_deg: 34.0
  lon_max_deg: 36.0
terrain:
  grid_res: 256
  relief_m: 900.0
  sea_level_frac: 0.35
families:
  - name: alpha
    revisit_s: 5.0
    max_range_m: 300000.0
    az_width_deg: 360.0
    false_alarms_per_scan: 4.0
  - name: bravo
    revisit_s: 2.0
    max_range_m: 150000.0
    az_width_deg: 120.0
    range_sigma_m: 25.0
    false_alarms_per_scan: 2.0
  - name: charlie
    revisit_s: 1.0
    max_range_m: 60000.0
    az_width_deg: 90.0
    az_sigma_deg: 0.6
    null_position_rate: 0.12
    false_alarms_per_scan: 1.0
fleet:
  n_sensors: 8
  emits_tracks_frac: 0.65
targets:
  per_day: true            # fresh targets each day, like every real corpus (truth mode needs it)
  n_targets: 60
emit:
  naming: contract
